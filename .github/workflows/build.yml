name: Safe CI baseline

on:
  push:
    branches:
      - codex/safe-ci-baseline
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emu1820m-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Core tests and non-loadable kernel gate
    runs-on: windows-2025-vs2026
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

