            $payload = $payload -replace '\s', ''
            [IO.File]::WriteAllBytes(
              $path,
              [Convert]::FromBase64String($payload)
            )
          } elseif ($text -notmatch '#pragma warning\(disable : 4324\)') {
            throw "The header changed unexpectedly; refusing to overwrite it."
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $path
          git diff --cached --quiet

          if ($LASTEXITCODE -eq 1) {
            git commit -m 'Acknowledge intentional MSVC cache-line padding'
            if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
            git push origin HEAD:codex/safe-ci-baseline
            if ($LASTEXITCODE -ne 0) { throw 'git push failed' }
          } elseif ($LASTEXITCODE -ne 0) {
            throw 'git diff failed'
          }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Restore pinned Microsoft WDK packages
        shell: pwsh
        run: nuget restore packages.config -PackagesDirectory packages

      - name: Configure hardware-independent core
        shell: pwsh
        run: cmake -S . -B out/core -A x64 -DEMU_BUILD_TESTS=ON -DEMU_BUILD_ENGINE_PROBE=ON

      - name: Build hardware-independent core
        shell: pwsh
        run: cmake --build out/core --config Release --parallel

      - name: Run realtime contract tests
        shell: pwsh
        run: ctest --test-dir out/core -C Release --output-on-failure

      - name: Run CI-only engine probe
        shell: pwsh
        run: .\out\core\Release\emu_engine_probe.exe

      - name: Compile non-loadable kernel safety gate
        shell: pwsh
        run: >-
          msbuild driver\bringup\Emu1820SafetyGate.vcxproj
          /m
          /t:Build
          /p:Configuration=Release
          /p:Platform=x64
          /verbosity:minimal

      - name: Verify that no installable package exists
        shell: pwsh
        run: |
          $forbidden = Get-ChildItem driver\bringup -Recurse -File -Include *.inf,*.cat
          if ($forbidden) {
            $forbidden | ForEach-Object {
              Write-Error "Forbidden installable artifact: $($_.FullName)"
            }
            throw 'Safe CI must not produce an installable driver package.'
          }

      - name: Prepare engineering-only artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item out\core\Release\emu_engine_probe.exe artifact\

          $gate = Get-ChildItem driver\bringup -Recurse -File -Filter Emu1820SafetyGate.sys |
            Select-Object -First 1
          if (-not $gate) { throw 'Kernel safety gate output was not found.' }
          Copy-Item $gate.FullName artifact\

          $pdb = Get-ChildItem driver\bringup -Recurse -File -Filter Emu1820SafetyGate.pdb |
            Select-Object -First 1
          if ($pdb) { Copy-Item $pdb.FullName artifact\ }

          @"
          ENGINEERING BUILD - DO NOT INSTALL

          Emu1820SafetyGate.sys deliberately returns STATUS_NOT_SUPPORTED.
          It contains no E-MU hardware implementation and has no INF/CAT files.
          Passing this build proves only that the pinned toolchain compiles.
          "@ | Set-Content artifact\DO_NOT_INSTALL.txt -Encoding UTF8

          Get-ChildItem artifact -File | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)"
          } | Set-Content artifact\SHA256SUMS.txt -Encoding ASCII

      - name: Upload engineering build
        uses: actions/upload-artifact@v4
        with:
          name: engineering-build-not-installable
          path: artifact
          if-no-files-found: error
          retention-days: 7


