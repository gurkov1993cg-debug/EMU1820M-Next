name: EMU1820M Driver Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install WDK
        shell: powershell
        run: |
          choco install windowsdriverkit11 --yes --no-progress

      - name: Clone E-MU driver source
        shell: powershell
        run: |
          git clone https://github.com/kxproject/kx-1010-driver.git driver

      - name: Generate WDK project
        shell: powershell
        run: |
          Set-Location driver

          $cppItems = Get-ChildItem -File -Filter *.cpp | ForEach-Object {
            '    <ClCompile Include="' + $_.Name + '" />'
          }

          $rcItems = Get-ChildItem -File -Filter *.rc | ForEach-Object {
            '    <ResourceCompile Include="' + $_.Name + '" />'
          }

          $project = @'
<?xml version="1.0" encoding="utf-8"?>
<Project DefaultTargets="Build"
         xmlns="http://schemas.microsoft.com/developer/msbuild/2003">

  <ItemGroup Label="ProjectConfigurations">
    <ProjectConfiguration Include="Release|x64">
      <Configuration>Release</Configuration>
      <Platform>x64</Platform>
    </ProjectConfiguration>
  </ItemGroup>

  <PropertyGroup Label="Globals">
    <Project
