          b3JlL2luY2x1ZGUvVVQFAAPeuo5qdXgLAAEEAAAAAAQAAAAAUEsBAh4DCgAAAAAA7WAaXQAAAAAA
          AAAAAAAAAB8AGAAAAAAAAAAQAO1BJS0AAEVNVTE4MjBNLU5leHQvY29yZS9pbmNsdWRlL2VtdS9V
          VAUAA966jmp1eAsAAQQAAAAABAAAAABQSwECHgMUAAAACADtYBpdUyMzjG4EAABkDgAANAAYAAAA
          AAABAAAApIF+LQAARU1VMTgyME0tTmV4dC9jb3JlL2luY2x1ZGUvZW11L3JlYWx0aW1lX2NvbnRy
          YWN0LmhwcFVUBQAD3rqOanV4CwABBAAAAAAEAAAAAFBLAQIeAwoAAAAAAO1gGl0AAAAAAAAAAAAA
          AAAXABgAAAAAAAAAEADtQVoyAABFTVUxODIwTS1OZXh0L2NvcmUvc3JjL1VUBQAD3rqOanV4CwAB
          BAAAAAAEAAAAAFBLAQIeAxQAAAAIAO1gGl3ZEe2/lAIAAB8JAAAsABgAAAAAAAEAAACkgasyAABF
          TVUxODIwTS1OZXh0L2NvcmUvc3JjL3JlYWx0aW1lX2NvbnRyYWN0LmNwcFVUBQAD3rqOanV4CwAB
          BAAAAAAEAAAAAFBLBQYAAAAAHAAcAPcKAAClNQAAAAA=
          '@

          $archive = Join-Path $env:RUNNER_TEMP "emu1820m-source.zip"
          $bytes = [Convert]::FromBase64String(($payload -replace '\s', ''))
          [IO.File]::WriteAllBytes($archive, $bytes)

          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne "4da78fac4272abea4b16ce2346727b6df26b4a9769c8683751bdf1a4555be14c") {
            throw "Embedded source archive failed its SHA-256 integrity check."
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP "emu1820m-source"
          if (Test-Path $extractRoot) { Remove-Item $extractRoot -Recurse -Force }
          Expand-Archive -Path $archive -DestinationPath $extractRoot -Force

          $sourceRoot = Join-Path $extractRoot "EMU1820M-Next"
          if (-not (Test-Path (Join-Path $sourceRoot "CMakeLists.txt"))) {
            throw "The archive does not contain the expected EMU1820M-Next project."
          }

          "root=$sourceRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish isolated review branch
        id: publish
        shell: pwsh
        run: |
          $branch = "codex/safe-ci-baseline"
          $sourceRoot = "${{ steps.source.outputs.root }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B $branch

          robocopy $sourceRoot $env:GITHUB_WORKSPACE /E /XD out packages artifact | Out-Host
          if ($LASTEXITCODE -ge 8) { throw "Source copy failed with robocopy exit code $LASTEXITCODE." }

          Remove-Item (Join-Path $env:GITHUB_WORKSPACE "build.yml") -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:GITHUB_WORKSPACE "EMU1820M-Next-safe-ci-baseline.zip") -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:GITHUB_WORKSPACE ".github/workflows/emu1820m-bootstrap.yml") -Force -ErrorAction SilentlyContinue

          git add -A
          $changes = @(git status --porcelain)
          if ($changes.Count -eq 0) { throw "No source changes were staged." }

          git commit -m "Add safe CI and realtime core baseline"
          git push --force origin "HEAD:refs/heads/$branch"

          "## Safe branch published" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Open: https://github.com/${{ github.repository }}/compare/main...$branch?expand=1" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Restore pinned Microsoft WDK packages
        shell: pwsh
        run: nuget restore "${{ steps.source.outputs.root }}\packages.config" -PackagesDirectory "${{ steps.source.outputs.root }}\packages" -NonInteractive

      - name: Configure hardware-independent core
        shell: pwsh
        run: cmake -S "${{ steps.source.outputs.root }}" -B "${{ steps.source.outputs.root }}\out\core" -A x64 -DEMU_BUILD_TESTS=ON -DEMU_BUILD_ENGINE_PROBE=ON

      - name: Build hardware-independent core
        shell: pwsh
        run: cmake --build "${{ steps.source.outputs.root }}\out\core" --config Release --parallel

      - name: Run realtime contract tests
        shell: pwsh
        run: ctest --test-dir "${{ steps.source.outputs.root }}\out\core" -C Release --output-on-failure

      - name: Run CI-only engine probe
        shell: pwsh
        run: |
          & "${{ steps.source.outputs.root }}\out\core\Release\emu_engine_probe.exe"

      - name: Compile non-loadable kernel safety gate
        shell: pwsh
        run: >-
          msbuild "${{ steps.source.outputs.root }}\driver\bringup\Emu1820SafetyGate.vcxproj"
          /m
          /t:Build
          /p:Configuration=Release
          /p:Platform=x64
          /verbosity:minimal

      - name: Verify that no installable package exists
        shell: pwsh
        run: |
          $driverRoot = Join-Path "${{ steps.source.outputs.root }}" "driver\bringup"
          $forbidden = Get-ChildItem $driverRoot -Recurse -File -Include *.inf,*.cat
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error "Forbidden installable artifact: $($_.FullName)" }
            throw "The safety baseline must not produce an installable driver package."
          }

      - name: Prepare engineering-only artifact
        shell: pwsh
        run: |
          $sourceRoot = "${{ steps.source.outputs.root }}"
          $artifact = Join-Path $env:RUNNER_TEMP "engineering-artifact"
          New-Item -ItemType Directory -Force $artifact | Out-Null
          Copy-Item (Join-Path $sourceRoot "out\core\Release\emu_engine_probe.exe") $artifact

          $gate = Get-ChildItem (Join-Path $sourceRoot "driver\bringup") -Recurse -File -Filter Emu1820SafetyGate.sys | Select-Object -First 1
          if (-not $gate) { throw "Kernel safety gate output was not found." }
          Copy-Item $gate.FullName $artifact

          $pdb = Get-ChildItem (Join-Path $sourceRoot "driver\bringup") -Recurse -File -Filter Emu1820SafetyGate.pdb | Select-Object -First 1
          if ($pdb) { Copy-Item $pdb.FullName $artifact }

          @"
          ENGINEERING BUILD - DO NOT INSTALL

          Emu1820SafetyGate.sys deliberately returns STATUS_NOT_SUPPORTED.
          It contains no E-MU hardware implementation and is shipped without INF/CAT files.
          Passing this build proves only that the pinned toolchain can compile the source.
          "@ | Set-Content (Join-Path $artifact "DO_NOT_INSTALL.txt") -Encoding UTF8

          Get-ChildItem $artifact -File | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)"
          } | Set-Content (Join-Path $artifact "SHA256SUMS.txt") -Encoding ASCII

      - name: Upload engineering build
        uses: actions/upload-artifact@v4
        with:
          name: engineering-build-not-installable
          path: ${{ runner.temp }}/engineering-artifact
          if-no-files-found: error
          retention-days: 7

      - name: Open pull request when permitted
        if: always() && steps.publish.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $branch = "codex/safe-ci-baseline"
          $existing = gh pr list --head $branch --base main --state open --json number --jq '.[0].number'
          if (-not $existing) {
            gh pr create --base main --head $branch --title "Safe CI and realtime core baseline" --body "Adds a hardware-independent realtime core, tests, architecture documentation, and a deliberately non-loadable kernel compilation gate. This is not an installable E-MU driver."
          }
