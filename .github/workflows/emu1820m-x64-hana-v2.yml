name: Publish EMU1820M x64 HANA read-only contract v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/emu1820m-x64-hana-v2.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: emu1820m-x64-hana-bootstrap-v2
  cancel-in-progress: false

