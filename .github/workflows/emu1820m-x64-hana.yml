name: Publish EMU1820M x64 HANA read-only contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/emu1820m-x64-hana.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: emu1820m-x64-hana-bootstrap
  cancel-in-progress: false

