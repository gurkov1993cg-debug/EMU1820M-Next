  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/emu1820m-x64-pnp-v2.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: emu1820m-x64-pnp-bootstrap-v2
  cancel-in-progress: false

