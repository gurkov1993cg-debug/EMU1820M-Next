          $archive = Join-Path $env:RUNNER_TEMP "emu1820m-x64-pnp.zip"
          $bytes = [Convert]::FromBase64String(($payload -replace '\s', ''))
          [IO.File]::WriteAllBytes($archive, $bytes)

          $expectedHash = "4ce008695f3ccfb730a90ebd03cf3843d23b648e47e859d427d4e8cebdbedb90"
          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Embedded source failed its SHA-256 integrity check."
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP "emu1820m-x64-pnp-verify"
          New-Item -ItemType Directory -Force $extractRoot | Out-Null
          Expand-Archive -Path $archive -DestinationPath $extractRoot -Force

          $sourceRoot = Join-Path $extractRoot "EMU1820M-Next"
          $required = @(
            "core\include\emu\pnp_contract.hpp",
            "core\src\pnp_contract.cpp",
            "driver\bringup\pnp_contract.c",
            "tests\pnp_contract_tests.cpp"
          )
          foreach ($path in $required) {
            if (-not (Test-Path (Join-Path $sourceRoot $path))) {
              throw "Embedded source is missing $path"
            }
          }

          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "root=$sourceRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore pinned Microsoft x64 WDK packages
        shell: pwsh
        run: nuget restore "${{ steps.source.outputs.root }}\packages.config" -PackagesDirectory "${{ steps.source.outputs.root }}\packages" -NonInteractive

      - name: Configure x64 user-mode targets
        shell: pwsh
        run: cmake -S "${{ steps.source.outputs.root }}" -B "${{ steps.source.outputs.root }}\out\core" -A x64 -DEMU_BUILD_TESTS=ON -DEMU_BUILD_ENGINE_PROBE=ON

      - name: Build x64 realtime and PCI-PnP contracts
        shell: pwsh
        run: cmake --build "${{ steps.source.outputs.root }}\out\core" --config Release --parallel

      - name: Run all hardware-independent stress tests
        shell: pwsh
        run: ctest --test-dir "${{ steps.source.outputs.root }}\out\core" -C Release --output-on-failure

      - name: Run dry-record and VST-monitor fail-safe probe
        shell: pwsh
        run: '& "${{ steps.source.outputs.root }}\out\core\Release\emu_engine_probe.exe"'

      - name: Compile x64 WDK PCI-PnP safety gate
        shell: pwsh
        run: >-
          msbuild "${{ steps.source.outputs.root }}\driver\bringup\Emu1820SafetyGate.vcxproj"
          /m
          /t:Build
          /p:Configuration=Release
          /p:Platform=x64
          /verbosity:minimal

      - name: Prove every produced PE target is x64
        id: binaries
        shell: pwsh
        run: |
          function Assert-X64PortableExecutable([string] $Path) {
            if (-not (Test-Path $Path)) { throw "Expected binary is missing: $Path" }

            $stream = [IO.File]::OpenRead($Path)
            try {
              $reader = [IO.BinaryReader]::new($stream)
              if ($reader.ReadUInt16() -ne 0x5A4D) { throw "Not a PE file: $Path" }
              $stream.Position = 0x3C
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) { throw "Invalid PE signature: $Path" }
              $machine = $reader.ReadUInt16()
              if ($machine -ne 0x8664) {
                throw ("Non-x64 PE output {0}; machine=0x{1:X4}" -f $Path, $machine)
              }
            }
            finally {
              $stream.Dispose()
            }
          }

          $sourceRoot = "${{ steps.source.outputs.root }}"
          $gate = Get-ChildItem (Join-Path $sourceRoot "driver\bringup") -Recurse -File -Filter Emu1820SafetyGate.sys | Select-Object -First 1
          if (-not $gate) { throw "Kernel safety gate output was not found." }

          $targets = @(
            (Join-Path $sourceRoot "out\core\Release\emu_core_tests.exe"),
            (Join-Path $sourceRoot "out\core\Release\emu_transport_tests.exe"),
            (Join-Path $sourceRoot "out\core\Release\emu_pnp_contract_tests.exe"),
            (Join-Path $sourceRoot "out\core\Release\emu_engine_probe.exe"),
            $gate.FullName
          )

          foreach ($target in $targets) {
            Assert-X64PortableExecutable $target
            Write-Host "Verified PE32+ x64: $target"
          }

          "gate=$($gate.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify this phase cannot bind or access hardware
        shell: pwsh
        run: |
          $sourceRoot = "${{ steps.source.outputs.root }}"
          $driverRoot = Join-Path $sourceRoot "driver\bringup"
          $forbidden = Get-ChildItem $driverRoot -Recurse -File -Include *.inf,*.cat
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error "Forbidden installable artifact: $($_.FullName)" }
            throw "This pre-hardware phase must not produce an installable package."
          }

          $entry = Get-Content (Join-Path $sourceRoot "driver\bringup\driver.c") -Raw
          if ($entry -notmatch 'return\s+STATUS_NOT_SUPPORTED\s*;') {
            throw "DriverEntry safety stop is missing."
          }
          if ($entry -match 'READ_PORT|WRITE_PORT|IoConnectInterrupt|IoAllocateMdl') {
            throw "DriverEntry unexpectedly contains a hardware-access path."
          }

      - name: Publish verified review branch
        id: publish
        shell: pwsh
        run: |
          $branch = "codex/x64-pnp-resource-contract"
          $publishRoot = Join-Path $env:RUNNER_TEMP "emu1820m-x64-pnp-publish"
          New-Item -ItemType Directory -Force $publishRoot | Out-Null
          Expand-Archive -Path "${{ steps.source.outputs.archive }}" -DestinationPath $publishRoot -Force
          $cleanSource = Join-Path $publishRoot "EMU1820M-Next"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git checkout -B $branch origin/main

          robocopy $cleanSource $env:GITHUB_WORKSPACE /E /XD "$cleanSource\.github" | Out-Host
          if ($LASTEXITCODE -ge 8) {
            throw "Pristine source copy failed with robocopy exit code $LASTEXITCODE."
          }

          git add -- .gitignore CMakeLists.txt Directory.Build.props README.md packages.config core docs driver tests tools
          $changes = @(git status --porcelain)
          if ($changes.Count -eq 0) {
            throw "No PCI-PnP changes were staged."
          }

          $forbiddenPaths = @(git diff --cached --name-only | Where-Object {
            $_ -match '(^|/)(\.github|build|out|obj|packages|artifact)/' -or
            $_ -match '\.(sys|inf|cat|exe|dll|obj|pdb|tlog|recipe|lastbuildstate)$'
          })
          if ($forbiddenPaths.Count -ne 0) {
            $forbiddenPaths | ForEach-Object { Write-Error "Forbidden staged path: $_" }
            throw "Generated or installable files were staged."
          }

          git commit -m "Add x64 PCI-PnP resource contract"
          git push --force-with-lease origin "HEAD:refs/heads/$branch"

          "branch=$branch" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "## Verified x64 PCI-PnP branch published" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Open: https://github.com/${{ github.repository }}/compare/main...$branch?expand=1" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Prepare non-installable x64 engineering evidence
        shell: pwsh
        run: |
          $sourceRoot = "${{ steps.source.outputs.root }}"
          $artifact = Join-Path $env:RUNNER_TEMP "x64-pnp-engineering"
          New-Item -ItemType Directory -Force $artifact | Out-Null

          Copy-Item (Join-Path $sourceRoot "out\core\Release\emu_pnp_contract_tests.exe") $artifact
          Copy-Item "${{ steps.binaries.outputs.gate }}" $artifact

          @"
          ENGINEERING X64 BUILD - DO NOT INSTALL

          This phase proves exact E-MU 1010 Hardware ID matching, bounded paired
          raw/translated PCI resources, and PnP lifecycle behavior in simulation.
          The WDK parser compiles but is dormant. DriverEntry still returns
          STATUS_NOT_SUPPORTED. No INF/CAT is included and no register is accessed.
          "@ | Set-Content (Join-Path $artifact "DO_NOT_INSTALL.txt") -Encoding UTF8

          Get-ChildItem $artifact -File | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)"
          } | Set-Content (Join-Path $artifact "SHA256SUMS.txt") -Encoding ASCII

      - name: Upload x64 PCI-PnP engineering evidence
        uses: actions/upload-artifact@v4
        with:
          name: x64-pnp-engineering-not-installable
          path: ${{ runner.temp }}/x64-pnp-engineering
          if-no-files-found: error
          retention-days: 7

      - name: Open pull request when permitted
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $branch = "${{ steps.publish.outputs.branch }}"
          $existing = gh pr list --head $branch --base main --state open --json number --jq '.[0].number'
          if (-not $existing) {
            gh pr create --base main --head $branch --title "Add x64 PCI-PnP resource contract" --body "Adds exact MAEM8810 Windows Hardware ID matching, bounded raw/translated START_DEVICE resource validation, a 100,000-cycle PnP lifecycle stress model, and a dormant x64 WDK parser. MSI, unexpected resources, installable packaging, and all register access remain disabled."
          }
