name: Publish EMU1820M x64 transport phase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/emu1820m-x64-transport.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: emu1820m-x64-transport-bootstrap
  cancel-in-progress: false

jobs:
  verify-and-publish:
    name: MSVC x64 transport and WDK safety gate
    runs-on: windows-2025-vs2026
    timeout-minutes: 40

